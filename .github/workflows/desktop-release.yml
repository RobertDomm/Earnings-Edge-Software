name: Build Desktop Installers

on:
  push:
    branches: [main]
    paths:
      - 'artifacts/desktop/**'
  workflow_dispatch:
    inputs:
      version_bump:
        description: >
          Version bump to apply before building. Required when shipping a new
          release — without a bump, electron-updater sees no version change
          and members never receive the update prompt.
        required: false
        default: none
        type: choice
        options:
          - none
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  # ── Prepare ────────────────────────────────────────────────────────────────
  # Computes the release version (bumping if requested), guards against
  # re-publishing the same version, and commits the bump back to the repo
  # so package.json stays in sync.
  prepare:
    name: Prepare release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Use a PAT or the default token so git push works.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version
        id: version
        run: |
          CURRENT=$(node -p "require('./artifacts/desktop/package.json').version")
          BUMP="${{ inputs.version_bump }}"

          if [[ "$BUMP" == "patch" || "$BUMP" == "minor" || "$BUMP" == "major" ]]; then
            VERSION=$(node -e "
              const [maj, min, pat] = '$CURRENT'.split('.').map(Number);
              if ('$BUMP' === 'major') process.stdout.write((maj+1)+'.0.0');
              else if ('$BUMP' === 'minor') process.stdout.write(maj+'.'+(min+1)+'.0');
              else process.stdout.write(maj+'.'+min+'.'+(pat+1));
            ")
            echo "Bumping $CURRENT → $VERSION"

            # Write the new version into package.json and commit it back so
            # the repo stays in sync with whatever gets built and released.
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('./artifacts/desktop/package.json', 'utf8'));
              pkg.version = '$VERSION';
              fs.writeFileSync('./artifacts/desktop/package.json', JSON.stringify(pkg, null, 2) + '\n');
            "
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add artifacts/desktop/package.json
            # [skip ci] prevents this commit from re-triggering the workflow.
            git commit -m "chore: bump desktop version to $VERSION [skip ci]"
            git push
          else
            VERSION="$CURRENT"
            echo "Using existing version: $VERSION"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Guard against re-shipping the same version
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Download latest.yml from the current published release.
          # If it reports the same version we're about to build, fail loudly
          # so the engineer knows to bump before shipping.
          PUBLISHED=$(curl -sf \
            "https://github.com/${{ github.repository }}/releases/latest/download/latest.yml" \
            | grep '^version:' | awk '{print $2}' \
            || echo "none")

          if [[ "$PUBLISHED" == "$VERSION" ]]; then
            echo "::error::Version $VERSION is already the published release."
            echo "::error::Run this workflow again with a version_bump input (patch / minor / major), or manually edit artifacts/desktop/package.json before pushing."
            exit 1
          fi

          echo "Version guard passed — building $VERSION (published: $PUBLISHED)"

  # ── macOS ──────────────────────────────────────────────────────────────────
  build-mac:
    name: macOS (.dmg)
    needs: [prepare]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch after the prepare commit so we get the bumped package.json.
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: artifacts/desktop
        run: npm install

      - name: Generate .icns icon from PNG
        working-directory: artifacts/desktop
        run: |
          mkdir -p /tmp/ee.iconset
          for SIZE in 16 32 64 128 256 512; do
            sips -z $SIZE $SIZE build/icon.png --out /tmp/ee.iconset/icon_${SIZE}x${SIZE}.png
            sips -z $((SIZE*2)) $((SIZE*2)) build/icon.png --out /tmp/ee.iconset/icon_${SIZE}x${SIZE}@2x.png
          done
          iconutil -c icns /tmp/ee.iconset -o build/icon.icns

      - name: Build macOS DMG
        working-directory: artifacts/desktop
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          REPO="${GITHUB_REPOSITORY#*/}"
          VERSION="${{ needs.prepare.outputs.version }}"
          ./node_modules/.bin/electron-builder --mac \
            --publish never \
            --config.publish.owner="$OWNER" \
            --config.publish.repo="$REPO" \
            --config.extraMetadata.version="$VERSION"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: |
            artifacts/desktop/dist/*.dmg
            artifacts/desktop/dist/latest-mac.yml

  # ── Windows ────────────────────────────────────────────────────────────────
  build-windows:
    name: Windows (.exe)
    needs: [prepare]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: artifacts/desktop
        run: npm install

      - name: Build Windows installer
        working-directory: artifacts/desktop
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          REPO="${GITHUB_REPOSITORY#*/}"
          VERSION="${{ needs.prepare.outputs.version }}"
          ./node_modules/.bin/electron-builder --win \
            --publish never \
            --config.publish.owner="$OWNER" \
            --config.publish.repo="$REPO" \
            --config.extraMetadata.version="$VERSION"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            artifacts/desktop/dist/*.exe
            artifacts/desktop/dist/latest.yml

  # ── Linux ──────────────────────────────────────────────────────────────────
  build-linux:
    name: Linux (.AppImage)
    needs: [prepare]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: artifacts/desktop
        run: npm install

      - name: Build Linux AppImage
        working-directory: artifacts/desktop
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          REPO="${GITHUB_REPOSITORY#*/}"
          VERSION="${{ needs.prepare.outputs.version }}"
          ./node_modules/.bin/electron-builder --linux \
            --publish never \
            --config.publish.owner="$OWNER" \
            --config.publish.repo="$REPO" \
            --config.extraMetadata.version="$VERSION"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            artifacts/desktop/dist/*.AppImage
            artifacts/desktop/dist/latest-linux.yml

  # ── Release ────────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [prepare, build-mac, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: EE Software Screener — Desktop App (v${{ needs.prepare.outputs.version }})
          body: |
            ## Download the EE Software Screener

            **Version ${{ needs.prepare.outputs.version }}**

            | Platform | File |
            |----------|------|
            | Mac (Intel + Apple Silicon) | `.dmg` |
            | Windows | `.exe` installer |
            | Linux | `.AppImage` |

            ### First-time install instructions
            **Mac:** Right-click the `.dmg` → Open → click **"Open"** in the security dialog (unsigned app warning, one-time only).
            **Windows:** Click **"More info"** → **"Run anyway"** in the SmartScreen warning (one-time only).
            **Linux:** Make the AppImage executable (`chmod +x *.AppImage`) then run it.

            ### Auto-updates
            Once installed, the app checks for new versions automatically on startup and prompts you to restart when one is ready — no manual reinstall needed.

            ### How it works
            The app loads `https://eesoftware.app/screener`. Sign in with your Circle email — access is verified automatically on every launch. If your membership is removed, you'll be redirected to the sign-in page.
          prerelease: false
          make_latest: true
          files: |
            dist-all/mac-dmg/*.dmg
            dist-all/mac-dmg/latest-mac.yml
            dist-all/windows-exe/*.exe
            dist-all/windows-exe/latest.yml
            dist-all/linux-appimage/*.AppImage
            dist-all/linux-appimage/latest-linux.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
